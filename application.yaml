apiVersion: argoproj.io/v1alpha1
kind: Application
meadata:
  name: microservices-argo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Shantanu-358/gitops-manifests.git"
    targetRevision: HEAD
    path: .
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true